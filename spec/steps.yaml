# Overlay step (kind thermal): reuses the resist-coat model.
- id: sti-06-post-exposure-bake
  module: sti
  title: Post-exposure bake
  kind: thermal
  tool: litho
  mask: null
  transition:
    type: thermal
  camera: overview
  cut: gate_y
  callouts:
    - anchor: photoresist
      text: Image appears in the film
  summary: >-
    Heat finishes what the light started: each acid molecule the light made sets
    off reaction after reaction.
  explanation: >-
    Light alone does not finish the job. Where it landed, it freed a little acid
    inside the film, and this second, hotter bake lets that acid move. The acid
    is never used up: it unlocks one spot in the film's plastic, then moves on
    to the next. That reuse lets a small dose of light make a big chemical
    change, and after this bake the image finally shows in the film.
  details: >-
    In a chemically amplified resist, the post-exposure bake completes the
    exposure. The heat lets the photoacid diffuse and react with blocking groups
    on the polymer, which makes a positive resist soluble in developer
    [PG2023-ch5-p212, PG2023-ch5-p213]. The acid is not consumed, so each
    molecule drives many reactions [PG2023-ch5-p212]. That catalysis is why such
    resists were developed for deep-UV sources, which are much weaker than
    mercury lamps [Xiao2012-ch6-p184]. After the bake, an image of the exposed
    areas appears in the resist [Xiao2012-ch6-p202].

    The bake runs on a hot plate at 110–130 °C for about 1 min, hotter than the
    soft bake for the same resist, and the wafer then cools on a chill plate
    [Xiao2012-ch6-p202]. Reaction and diffusion rates depend exponentially on
    temperature, so time and especially temperature are tightly controlled
    [PG2023-ch5-p187]. The bake also smooths the standing waves that reflections
    left in the exposure [Xiao2012-ch6-p202, PG2023-ch5-p211]; underbaking
    leaves them, and overbaking hardens the resist and spoils development
    [Xiao2012-ch6-p202]. Neither source gives the gas around the hot plate.
  params:
    - name: temperature
      value: "110–130"
      unit: °C
      source: Xiao2012-ch6-p202
      confidence: single-source
    - name: time
      value: 1
      unit: min
      source: Xiao2012-ch6-p202
      confidence: single-source
    - name: ambient
      value: not stated (hot plate in the track)
      unit: null
      source: Xiao2012-ch6-p202
      confidence: uncertain
    - name: method
      value: hot plate, then chill plate
      unit: null
      source: Xiao2012-ch6-p202
      confidence: single-source

# Model: photoresist kept over the two active rectangles of masks/inverter.yaml;
# photoresist__removed is the film developed away over the future trenches.
- id: sti-07-develop
  module: sti
  title: Development
  kind: geometry
  tool: litho
  mask: active
  transition:
    type: litho_develop
  camera: overview
  cut: gate_y
  callouts:
    - anchor: photoresist
      text: Photoresist, now patterned
    - anchor: resist_opening
      text: Opening where a trench goes
  summary: >-
    A weak alkaline solution washes away the light-struck film, and the first
    pattern stands in relief.
  explanation: >-
    Sprayed onto the spinning wafer, the solution dissolves the film wherever
    the light struck, then water rinses it away and the spin dries the wafer.
    The film now stands only over the two future transistors, open where
    trenches will be cut. Before any etching, machines measure the pattern. If
    it is off, the fab strips the film and prints the wafer again; after the
    etch, a mistake would mean scrapping it.
  details: >-
    The developer dissolves the exposed regions of this positive resist
    [Xiao2012-ch6-p203]. Fabs use tetramethylammonium hydroxide (TMAH), a base
    free of sodium and potassium, whose mobile ions would damage devices
    [Xiao2012-ch6-p203]; Plummer & Griffin likewise describe positive deep-UV
    resists dissolving in a basic developer once the polymer is unblocked
    [PG2023-ch5-p187]. Development has three parts, develop, rinse, and dry, on
    a spinning wafer in the track, with the developer sprayed or puddled on and
    a deionized-water rinse [Xiao2012-ch6-p203, Xiao2012-ch6-p204,
    PG2023-ch5-p187]. The developer is sensitive to temperature: too warm
    overdevelops and shrinks features, too cool underdevelops
    [Xiao2012-ch6-p204].

    After development, the pattern is checked for overlay, line width (by
    CD-SEM or scatterometry), and defects [Xiao2012-ch6-p206,
    Xiao2012-ch6-p210]. A resist pattern is still temporary and can be stripped
    and reworked; after an etch or implant it is permanent, and a bad wafer is
    scrapped [Xiao2012-ch6-p206]. An advanced CMOS chip needs more than 30
    masks, each with this check [Xiao2012-ch6-p206].

    Both textbook sequences end with a hard bake that strengthens the resist for
    the etch: 100–130 °C for 1–2 min on a hot plate [Xiao2012-ch6-p205], or
    10–30 min at 125–150 °C in Plummer & Griffin's typical flow
    [PG2023-ch5-p185]. It is described here rather than shown as its own step.
  params:
    - name: developer
      value: TMAH
      unit: null
      source: Xiao2012-ch6-p203
      confidence: single-source
    - name: resist_tone
      value: positive
      unit: null
      source: [PG2023-ch2-p39, Xiao2012-ch6-p203]
      confidence: verified
    - name: method
      value: spray or puddle, on a spinning wafer
      unit: null
      source: [Xiao2012-ch6-p204, PG2023-ch5-p187]
      confidence: verified
    - name: rinse
      value: deionized water
      unit: null
      source: [Xiao2012-ch6-p204, PG2023-ch5-p187]
      confidence: verified

# Model: one resist-on etch through the nitride (z +108.2 to +8.2), the pad oxide
# (+8.2 to -6.8), and 200 nm of silicon (-6.8 to -206.8). Nitride and oxide walls
# vertical; silicon walls 87 degrees from horizontal, so each wall moves in about
# 10.5 nm over the 200 nm depth (200 x tan 3 degrees). Bottom corners rounded
# (radius unsourced); top corners stay sharp until the HF undercut and liner steps.
# Resist thinning during the etch is not modeled (no source for the amount).
- id: sti-08-trench-etch
  module: sti
  title: Trench etch
  kind: geometry
  tool: etch
  mask: null
  story: true
  transition:
    type: etch_anisotropic
  camera: overview
  cut: gate_y
  callouts:
    - anchor: trench
      text: Trench, 200 nm into silicon
    - anchor: sidewall
      text: Wall tilted about 3°
    - anchor: photoresist
      text: Photoresist, still in place
  summary: >-
    A plasma, the same kind of glowing gas that lights a fluorescent tube,
    carves trenches 200 nm deep.
  explanation: >-
    Wherever the photoresist left an opening, the plasma eats through the
    nitride and the thin glass, then switches gases to cut into the silicon.
    These trenches will become the glass moats between transistors. Their walls
    lean outward about 3° on purpose, so the glass that fills them later leaves
    no hidden gaps. In the silicon there is no layer to stop on, so the etch
    simply runs on a timer.
  details: >-
    The resist stays on while the plasma cuts all three layers, and is
    stripped afterward [PG2023-ch2-p39, Quirk2001-ch9-p208]. Wolf reports this
    single-chamber, resist-on sequence in production by 2000, and more feasible
    as trench walls steepened [Wolf2002-ch9-p449]. Xiao's advanced flow
    differs: it strips the resist after the nitride and pad-oxide etch and cuts
    the silicon with the nitride alone as the mask, to avoid contamination from
    the resist [Xiao2012-ch13-fig13.7, Xiao2012-ch9-p334, Xiao2012-ch9-p352].
    In that order the silicon etch must be selective to nitride, uniformly
    across the wafer, because nitride lost here comes out of the margin for the
    later polish [Ventzek2007-ch21-p20].

    The nitride and pad oxide are etched with fluorocarbon gases such as
    CF<sub>4</sub>/CHF<sub>3</sub> under heavy ion bombardment, as vertically
    as possible [Xiao2012-ch9-p342, Xiao2012-ch9-p343, Ventzek2007-ch21-p20].
    The silicon is etched mainly with HBr, after a fluorine-based breakthrough
    step; O<sub>2</sub> builds a thin oxide-like film on the sidewalls, which
    sets the taper [Xiao2012-ch9-p352, Xiao2012-ch9-p353, Ventzek2007-ch21-p20].
    Wolf lists HBr/Cl<sub>2</sub>/O<sub>2</sub> and
    HBr/NF<sub>3</sub>/He/O<sub>2</sub> for this step [Wolf2002-ch9-p447]. In
    Xiao's classification the nitride and oxide etches are ion-assisted by
    surface damage, and the silicon etch by sidewall blocking
    [Xiao2012-ch9-tab9.3]. Xiao assigns silicon to inductively coupled plasma
    (ICP) chambers and dielectrics to capacitively coupled (CCP) ones in
    300 mm fabs [Xiao2012-ch9-p363]; the single-chamber sequence opens the
    nitride in situ, in the silicon etcher [Wolf2002-ch9-p449]. The plasma is
    similar to the one in a fluorescent tube [PG2023-ch2-p39].

    Depth: Intel lists its 32 nm isolation as 200 nm thick [Natarajan2008-tab1].
    The model reads that as the depth etched into the silicon, measured from
    the silicon surface left by the pad oxidation. The finished oxide stands
    slightly above the silicon [Pan1998-p1, Shinn2007-ch17-p43], so the true
    etch depth may be a little less. IBM-alliance trenches of the 45 nm era
    were deeper, about 285–340 nm in published cross-sections
    [Tilke2006-fig6, Tilke2006-fig7].

    Profile: no source gives Intel's wall angle. Published scaled trenches
    stand at 87–88° from the surface [Wolf2002-ch9-p455, Tilke2007-p61], and
    the model uses 87°, which is 3° from vertical. A slight slope avoids seams
    in the fill, while steeper or overhanging walls cause them
    [Ventzek2007-ch21-p20, Tilke2007-p61]. Plummer & Griffin's simulation
    figure uses 85° [PG2023-ch2-p38-fig2.4]. The bottom corners are rounded
    [Wolf2002-ch9-p447, Quirk2001-ch9-p208]; the top corners stay sharp for now.
    Sharp corners concentrate the electric field and raise leakage
    [PG2023-ch2-p39, Ventzek2007-ch21-p20], so the next steps round them
    [Wolf2002-ch9-p450, PG2023-ch2-p40].

    Endpoint: the nitride and oxide etches can be ended when the plasma's
    emission changes, watching lines from CN, N, or O
    [Xiao2012-ch9-p342, Xiao2012-ch9-p343, Xiao2012-ch9-p349]; an overetch
    follows the endpoint [Xiao2012-ch9-p322]. The silicon has no layer beneath
    to signal the end, so its etch is timed
    [Xiao2012-ch9-p352, Xiao2012-ch9-p353].
  params:
    - name: sequence
      value: "nitride, pad oxide, then silicon, resist on throughout"
      unit: null
      source: [PG2023-ch2-p39, Quirk2001-ch9-p208]
      confidence: verified
    - name: nitride_oxide_chemistry
      value: CF<sub>4</sub>/CHF<sub>3</sub>
      unit: null
      source: [Xiao2012-ch9-p342, Ventzek2007-ch21-p20]
      confidence: verified
    - name: silicon_chemistry
      value: HBr/O<sub>2</sub>
      unit: null
      source: [Xiao2012-ch9-p352, Wolf2002-ch9-p447]
      confidence: verified
    - name: depth
      value: 200
      unit: nm
      source: Natarajan2008-tab1
      confidence: single-source
    - name: sidewall_angle
      value: 87
      unit: °
      source: [Wolf2002-ch9-p455, Tilke2007-p61]
      confidence: verified
    - name: bottom_corners
      value: rounded
      unit: null
      source: [Wolf2002-ch9-p447, Quirk2001-ch9-p208]
      confidence: verified
    - name: silicon_endpoint
      value: timed
      unit: null
      source: [Xiao2012-ch9-p352, Xiao2012-ch9-p353]
      confidence: single-source
  fab_reality:
    note: >-
      Plummer & Griffin's flow chapter etches the silicon trench with fluorine
      chemistry, with carbon deposited from CF<sub>4</sub> shaping the taper
      (p. 39), and their etching chapter offers fluorine etching as one way to
      taper an STI trench (p. 436). Manufacturing references use HBr as the main
      silicon etchant instead, with O<sub>2</sub> forming an oxide-like film on
      the sidewalls that sets the taper; fluorine-based gases etch the nitride
      and oxide, run a breakthrough step, or tune the profile. The etching
      chapter itself notes that Cl<sub>2</sub>/HBr mixtures are often used for
      anisotropic silicon etching (p. 436).
    source: [PG2023-ch2-p39, PG2023-ch9-p436, Xiao2012-ch9-p342,
             Xiao2012-ch9-p352, Xiao2012-ch9-p353, Wolf2002-ch9-p447,
             Ventzek2007-ch21-p20]

# Model: photoresist removed (photoresist__removed); nothing else changes. The
# clean that follows is mentioned in the text, not modeled.
- id: sti-09-resist-strip
  module: sti
  title: Resist strip
  kind: geometry
  tool: wet
  mask: null
  transition:
    type: strip
  camera: overview
  cut: gate_y
  callouts:
    - anchor: nitride
      text: Nitride stencil, uncovered
    - anchor: trench
      text: Open trench, bare silicon
  summary: >-
    The first scaffolding comes down: an acid bath removes the light-sensitive
    film and leaves the trenches open.
  explanation: >-
    A mix of sulfuric acid and hydrogen peroxide eats away the photoresist
    without attacking the nitride, the glass, or the silicon. The film's only
    job, shielding the future transistors during the etch, is done, and it
    could not survive the heat of the steps ahead. A cleaning bath follows,
    leaving the trenches open down to bare silicon. An advanced chip repeats
    this cycle of print, use, and strip more than 30 times.
  details: >-
    Resist is removed either wet, in a mixture of sulfuric acid and hydrogen
    peroxide (SPM), or dry, in an oxygen plasma; neither attacks the nitride,
    oxide, or silicon beneath it [PG2023-ch2-p39]. The model shows the wet
    route. Strips are purely chemical etches, with no ion bombardment
    [Xiao2012-ch9-tab9.3]. No source read so far gives the mixture ratio or
    temperature for this strip.

    Stripping after the full etch follows Plummer & Griffin and Quirk & Serda
    [PG2023-ch2-p39, Quirk2001-ch9-p208]; Pan et al.'s typical sequence also
    has a resist strip and clean right after the trench etch [Pan1998-p1].
    Resist cannot withstand high temperatures: later in the flow, a nitride
    hard mask replaces it for the 750–850 °C epitaxy [PG2023-ch2-p51]. So it
    has to go before the trench liner is grown.

    After the strip, the wafers are cleaned before the liner is grown
    [PG2023-ch2-p39]; Xiao likewise follows the silicon etch with a wet clean
    [Xiao2012-ch9-p352, Xiao2012-ch9-p353]. The clean is described here rather
    than shown as its own step.

    Every later mask repeats this cycle: the resist is patterned, blocks an
    etch or an implant, and is stripped [PG2023-ch2-p41, PG2023-ch2-p49]. An
    advanced CMOS chip needs more than 30 masks [Xiao2012-ch6-p206].
  params:
    - name: chemistry
      value: H<sub>2</sub>SO<sub>4</sub> + H<sub>2</sub>O<sub>2</sub>
      unit: null
      source: PG2023-ch2-p39
      confidence: single-source
    - name: dry_alternative
      value: O<sub>2</sub> plasma
      unit: null
      source: PG2023-ch2-p39
      confidence: single-source
