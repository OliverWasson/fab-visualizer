# Process steps, in process order. Schema: CONVENTIONS.md (Spec schema); tiers and story mode:
# SCOPE.md §2; voice: STYLE.md §12; notation: STYLE.md §5; transitions: STYLE.md §7.
# Checked by `python -m pipeline.check`.
#
# Conventions used in this file:
#   - Text uses HTML <sub>/<sup> markup and a thin space (U+2009) between a number and its unit.
#   - Inline citations in details are written [SourceKey-locator], resolving to spec/sources.md.
#   - A param value is a number when the pipeline consumes it (write floats as 1.0e+15:
#     PyYAML reads 1e15 as a string), and a string for ranges, chemistry, and labels.
#   - Developer notes go in comments like these, never in reader text.

# Model: z = 0 is this original surface; every later depth is measured from it.
# Open: how the cell is oriented relative to the notch, which sets the channel
# direction and whether trench sidewalls are (110) (SCOPE.md §12).
- id: wafer-01-substrate
  module: wafer
  title: Starting wafer
  kind: geometry
  tool: wet
  mask: null
  story: true
  transition:
    type: intro
  camera: overview
  cut: gate_y
  callouts:
    - anchor: substrate
      text: Single-crystal silicon
  summary: >-
    Every chip starts as a mirror-smooth disk of silicon, sliced from one giant,
    nearly flawless crystal.
  explanation: >-
    This 300 mm disk is a single crystal, with its atoms lined up from edge to
    edge, and one of the purest materials people make. A faint trace of boron
    gives it a slightly positive, or p-type, character. The disk is 775 µm thick,
    about the width of eight human hairs, yet every transistor will live in
    roughly its top thousandth. First, chemical baths wash off dirt and the thin
    skin of oxide that forms in air.
  details: >-
    A wafer is ordered by diameter, crystal orientation, doping type, and doping
    level [PG2023-ch2-p37]. Its surface is a (100) crystal plane, which forms
    the best interface with silicon dioxide [PG2023-ch2-p37]. A 300 mm wafer
    is 775 µm thick, and a notch in its edge marks the crystal orientation
    [Xiao2012-ch4-p105]. Wafers this size are sliced from a single crystal pulled
    from molten silicon, the Czochralski method [Xiao2012-ch4-p103]. Apart from
    oxygen, carbon, and the deliberate dopant, impurities are in the parts per
    trillion, and every atom sits on its lattice site [PG2023-ch2-p37].

    The sources agree that p-type substrates are the usual choice but give
    different reasons: easier uniform crystal growth [PG2023-ch2-p37], or mostly
    history [Xiao2012-ch13-p550]. The NMOS transistor could be built directly in
    the p-type substrate, but separate wells are more common because implanted
    well doping is far better controlled than the wafer's own doping
    [PG2023-ch2-p37]. A boron level near 1×10<sup>15</sup> cm<sup>−3</sup>
    corresponds to a resistivity of roughly 5–20 Ω·cm [PG2023-ch2-p37].

    The incoming clean is described rather than modeled. A baseline STI flow
    begins with an RCA wet clean [Wolf2002-ch9-p446], and a dilute HF dip removes
    the 1–2 nm native oxide just before oxidation
    [Xiao2012-ch5-p130, Xiao2012-ch9-p326].

    Comparisons: eight hairs assumes a hair width of about 90 µm (775 ÷ 90 ≈ 8.6).
    The top thousandth of 775 µm is about 0.8 µm; the deepest structures in
    this module, the 200 nm isolation trenches, sit well inside it
    [Natarajan2008-tab1]. The model shows only the top of the wafer; the rest
    continues to the full 775 µm.
  params:
    - name: diameter
      value: 300
      unit: mm
      source: [Xiao2012-ch4-tab4.2, Quirk2001-ch4-p76]
      confidence: verified
    - name: thickness
      value: 775
      unit: µm
      source: [Xiao2012-ch4-tab4.2, Quirk2001-ch4-p76]
      confidence: verified
    - name: orientation_mark
      value: notch
      unit: null
      source: [Xiao2012-ch4-p105, Quirk2001-ch4-p82]
      confidence: verified
    - name: surface_orientation
      value: "(100)"
      unit: null
      source: [PG2023-ch2-p37, Xiao2012-ch13-p550]
      confidence: verified
    - name: conductivity_type
      value: p
      unit: null
      source: [PG2023-ch2-p37, Xiao2012-ch13-p550]
      confidence: verified
    - name: dopant
      value: boron
      unit: null
      source: PG2023-ch2-p37
      confidence: single-source
    - name: doping
      value: 1.0e+15
      unit: cm<sup>−3</sup>
      source: [PG2023-ch2-p37, Xiao2012-ch13-p550]
      confidence: verified
    - name: resistivity
      value: "5–20"
      unit: Ω·cm
      source: PG2023-ch2-p37
      confidence: single-source
    - name: incoming_clean
      value: RCA clean
      unit: null
      source: Wolf2002-ch9-p446
      confidence: single-source
    - name: native_oxide_strip
      value: "10:1 HF"
      unit: null
      source: Xiao2012-ch9-p326
      confidence: single-source
  fab_reality:
    note: >-
      Advanced CMOS usually starts on an epitaxial wafer: a lightly doped p-type
      silicon layer grown by the wafer maker on a more heavily doped substrate.
      The epi layer is silicon on silicon, so it would look identical here and
      is not drawn. Intel's 32 nm starting wafer is not published.
    source: [Xiao2012-ch4-p109, Xiao2012-ch13-p551, Quirk2001-ch9-fig9.8]

# Model: oxide top at z ≈ +8.2 nm, silicon surface at z ≈ −6.8 nm (0.45 of 15 nm consumed).
- id: sti-01-pad-oxide
  module: sti
  title: Pad oxide
  kind: geometry
  tool: furnace
  mask: null
  transition:
    type: oxidize
  camera: overview
  cut: gate_y
  callouts:
    - anchor: pad_oxide
      text: Pad oxide, 15 nm
    - anchor: original_surface
      text: Original silicon surface
  summary: >-
    Baking the wafer in oxygen grows a glassy layer just 15 nm thick, the first
    of many temporary layers.
  explanation: >-
    Near 1000 °C in pure oxygen, the silicon surface turns into silicon
    dioxide, the same compound as glass. The glass grows by eating into the
    silicon, so the surface ends up slightly lower than where it started. Why
    now? The next layer, silicon nitride, pulls so hard on whatever it touches
    that it could crack the crystal, and this thin glass is the cushion between
    them. Both layers are scaffolding, gone before any transistor exists.
  details: >-
    About 15 nm is the middle of the usual 10–20 nm range for a pad oxide
    under nitride [Xiao2012-ch5-p132, Quirk2001-ch9-p208]. A 0.25 µm-era STI
    flow used about 10 nm, thinner than the 25–40 nm used for LOCOS, since
    STI has no long field oxidation [Wolf2002-ch9-p446]; another textbook gives
    10–50 nm [PG2023-ch6-p243].

    LPCVD nitride carries stress up to about 10<sup>10</sup> dyn/cm<sup>2</sup>
    (1 GPa), which the pad oxide buffers [Xiao2012-ch5-p132]; without it, that
    stress can damage the wafer [Xiao2012-ch13-p557]. Part of the stress comes
    from the different thermal expansion of silicon and nitride
    [Xia2007-ch13-p31].

    Thin oxides are grown in dry O<sub>2</sub> at about 1000 °C with HCl
    added [Xiao2012-ch5-p140]; chlorine helps neutralize metal contamination
    [Cleavelin2007-ch9-p5]. No source gives the time for this node, so the
    model sets the thickness directly. The step usually runs in a vertical
    batch furnace [Quirk2001-ch9-p208]; rapid thermal oxidation is also listed
    for pad oxides at the 65–22 nm nodes [Timans2007-ch11-tab11.1a].

    Oxidation consumes silicon. The oxide takes up about 2.2 times the volume
    of the silicon it replaces [PG2023-ch2-p39], so about 0.45 of its thickness
    lies below the original surface: here about 6.8 nm below and 8.2 nm above.
    The pad oxide is stripped at the start of the well module, after the STI
    is finished [Wolf2002-ch9-p453].
  params:
    - name: thickness
      value: 15
      unit: nm
      source: [Xiao2012-ch5-p132, Quirk2001-ch9-p208]
      confidence: verified
    - name: ambient
      value: dry O<sub>2</sub> + HCl
      unit: null
      source: Xiao2012-ch5-p140
      confidence: single-source
    - name: temperature
      value: 1000
      unit: °C
      source: Xiao2012-ch5-p140
      confidence: single-source
    - name: si_consumed_fraction
      value: 0.45
      unit: null
      source: PG2023-ch2-p39
      confidence: single-source
  # Go deeper. No rate constants on purpose: Table 6-1 (PG2023 p. 252) has them, but
  # the model is weakest below about 20 nm in dry O2 (pp. 251, 254), so a computed
  # growth time for this 15 nm film would mislead. The step sets the thickness directly.
  physics:
    - name: Deal–Grove oxidation model
      equation: '\frac{x_{\mathrm{ox}}^{2}}{B} + \frac{x_{\mathrm{ox}}}{B/A} = t + \tau'
      explanation: >-
        Oxidant diffuses through the existing oxide and reacts with silicon at
        the buried interface, so growth slows as the thickness x<sub>ox</sub>
        increases with time t. B, the parabolic rate constant, is set by oxidant
        diffusion through the oxide; B/A, the linear rate constant, by the
        interface reaction; τ accounts for oxide present at t = 0. Thin films
        grow linearly, x<sub>ox</sub> ≈ (B/A)(t + τ); thick ones parabolically,
        x<sub>ox</sub><sup>2</sup> ≈ B(t + τ). Both are Arrhenius in temperature.
        In dry O<sub>2</sub> the first ≈20 nm grows faster than predicted, so
        this 15 nm film lies entirely in that regime.
      source: [PG2023-ch6-p250, PG2023-ch6-p251, PG2023-ch6-p254, PG2023-ch2-p39,
               Xiao2012-ch5-p139]

- id: sti-02-nitride
  module: sti
  title: Nitride deposition
  kind: geometry
  tool: furnace
  mask: null
  story: true
  transition:
    type: deposit_conformal
  camera: overview
  cut: gate_y
  callouts:
    - anchor: nitride
      text: Silicon nitride, 100 nm
    - anchor: pad_oxide
      text: Pad oxide cushion
  summary: >-
    A hard, oxygen-proof film of silicon nitride coats the wafer: a stencil, a
    shield, and a stop sign.
  explanation: >-
    Two gases react in a hot, low-pressure furnace and leave an even film of
    silicon nitride, about 100 nm thick, on every wafer in the batch. This
    tough layer has three jobs. It becomes the stencil for carving trenches, it
    shields the silicon from oxygen while the trench walls are treated, and it
    acts as a stop sign when a later step polishes the wafer flat. Then it, too,
    gets stripped away.
  details: >-
    About 100 nm is uncertain. The available values are from the 0.25 µm
    era: 100–200 nm [Wolf2002-ch9-p447] and a typical 170 nm [Pan1998-p1];
    no source gives a 32 nm value. The thickness matters later, because it is
    the budget for every step that lowers the STI oxide, which should end level
    with or slightly above the active silicon [Pan1998-p1].

    The process is LPCVD (low-pressure chemical vapor deposition) in a
    furnace-like reactor with a vertical wafer boat, at 0.1–1 Torr
    [Xiao2012-ch10-p375]. Low pressure keeps the film uniform across a large
    batch of wafers [PG2023-ch2-p38]. Dichlorosilane
    (SiH<sub>2</sub>Cl<sub>2</sub>) and ammonia (NH<sub>3</sub>) react at
    700–800 °C [Xiao2012-ch5-p165, Quirk2001-ch11-p275], leaving ammonium
    chloride (NH<sub>4</sub>Cl) as a byproduct [Xiao2012-ch5-p166]. Silane
    (SiH<sub>4</sub>) with ammonia also works, at about 900 °C
    [Xiao2012-ch5-p166].

    Nitride can't simply be grown: the oxide already on the surface keeps the
    silicon from reacting with nitrogen, and direct nitridation is
    self-limiting [PG2023-ch2-p38].

    Nitride barely etches in HF, about 1–1.5 nm/min in 6:1 buffered HF
    against about 90 nm/min for steam-grown oxide [Xia2007-ch13-p31], so it
    survives the HF dips later in the module. The film also coats the back of
    the wafer, and the later nitride strip removes it [Wolf2002-ch9-p447]; the
    model shows the front only.
  params:
    - name: method
      value: LPCVD
      unit: null
      source: [Xiao2012-ch5-p165, Quirk2001-ch9-p208, PG2023-ch2-p38]
      confidence: verified
    - name: thickness
      value: 100
      unit: nm
      source: [Wolf2002-ch9-p447, Pan1998-p1]
      confidence: uncertain
    - name: precursors
      value: SiH<sub>2</sub>Cl<sub>2</sub> + NH<sub>3</sub>
      unit: null
      source: [Xiao2012-ch5-p165, Quirk2001-ch11-p275, PG2023-ch2-p38]
      confidence: verified
    - name: temperature
      value: "700–800"
      unit: °C
      source: [Xiao2012-ch5-p165, Quirk2001-ch11-p275]
      confidence: verified
    - name: pressure
      value: "0.1–1"
      unit: Torr
      source: Xiao2012-ch10-p375
      confidence: single-source
    - name: film_stress
      value: up to 1×10<sup>10</sup>
      unit: dyn/cm<sup>2</sup>
      source: Xiao2012-ch5-p132
      confidence: single-source
  fab_reality:
    note: >-
      Plummer & Griffin (p. 38) write the dichlorosilane precursor as
      "Si<sub>2</sub>Cl<sub>2</sub>"; it should read
      SiH<sub>2</sub>Cl<sub>2</sub>.
    source: [PG2023-ch2-p38, Xiao2012-ch5-p165]

# STI lithography walkthrough: the one full tour (SCOPE.md §8.3). Later masks get two
# steps, resist patterned and resist strip.
# Model: one photoresist layer (resist + BARC) over the nitride, z +108.2 to +208.2
# (100 nm, uncertain). Its anchors also serve the callouts of the three overlay steps
# that follow (soft bake, exposure, post-exposure bake), which reuse this model.
# Transition: no animator spreads a liquid outward; deposit_directional's rising
# plane is the closer look for a liquid film on a flat wafer.
- id: sti-03-resist-coat
  module: sti
  title: Resist coat
  kind: geometry
  tool: litho
  mask: null
  transition:
    type: deposit_directional
  camera: overview
  cut: gate_y
  callouts:
    - anchor: photoresist
      text: Photoresist, a light-sensitive film
  summary: >-
    The wafer spins thousands of times a minute, flinging a honey-thick liquid into
    an even film.
  explanation: >-
    The trenches need a pattern, so the wafer gets photoresist, a light-sensitive
    coating that will carry it. A few drops land at the center, and spinning
    spreads them over the whole 300 mm disk as the solvent evaporates. The faster
    the spin, the thinner the film. A thin layer spun on first keeps light from
    bouncing back off the wafer. Like the layers before it, this film is
    scaffolding: it will be gone right after the trenches are cut.
  details: >-
    The coat-and-develop track and the scanner work as one linked line. Xiao's
    sequence for an advanced track is clean, bake and prime, spin coat, soft
    bake, align and expose, post-exposure bake, develop, hard bake, and
    inspection [Xiao2012-ch6-p185, Xiao2012-ch6-p186-fig6.7]. Preparation is a
    1–2 min hot-plate bake at 150–200 °C to drive off adsorbed moisture, with
    HMDS vapor primed in the same chamber to help the resist adhere; the wafer
    then cools on a chill plate before coating
    [Xiao2012-ch6-p187, Xiao2012-ch6-p188]. Plummer & Griffin describe a similar
    dehydration bake and HMDS priming, usually from vapor
    [PG2023-ch5-p185, PG2023-ch5-p186]. An
    organic bottom anti-reflective coating (BARC) is spun on before the resist
    to cut reflections from the layers below [Xiao2012-ch6-p201,
    Xiao2012-ch6-p202, PG2023-ch5-p222]; the model draws BARC and resist as one
    layer.

    Resist is dispensed onto the center of the wafer turning at about 500 rpm,
    then spun at up to 7000 rpm; the thickness falls as the inverse square root
    of the spin rate [Xiao2012-ch6-p189]. Plummer & Griffin give 3000–6000 rpm
    for about 30 s: the film levels in the first few seconds, and the solvent
    keeps evaporating for the rest [PG2023-ch5-p186]. The liquid is about as
    thick as honey [PG2023-ch2-p38].

    No source gives the resist or BARC thickness for this layer at 32 nm.
    Plummer & Griffin's typical single-layer range is 0.1–0.5 µm, thinner for
    high-resolution imaging [PG2023-ch5-p186], and the imaging layer of
    multilayer stacks is often under 100 nm [PG2023-ch5-p222]; Xiao's 0.3–3 µm
    is a generic range, not specific to 193 nm resists [Xiao2012-ch6-p189]. The
    model uses 100 nm for resist and BARC together, flagged uncertain. A thinner
    film resolves finer features but holds up to the etch for less time
    [Xiao2012-ch6-p184].

    The track is joined to the scanner because many resists must be exposed
    soon after their bake [Xiao2012-ch6-p199, Xiao2012-ch6-p211]. The film is
    scaffolding: it masks the etch and is stripped right after
    [PG2023-ch2-p39].
  params:
    - name: method
      value: spin coating
      unit: null
      source: [Xiao2012-ch6-p189, PG2023-ch5-p186]
      confidence: verified
    - name: thickness
      value: 100
      unit: nm
      source: PG2023-ch5-p186
      confidence: uncertain
    - name: spin_speed
      value: "3000–6000"
      unit: rpm
      source: PG2023-ch5-p186
      confidence: single-source
    - name: primer
      value: HMDS vapor
      unit: null
      source: [Xiao2012-ch6-p188, PG2023-ch5-p186]
      confidence: verified
    - name: prebake_temperature
      value: "150–200"
      unit: °C
      source: Xiao2012-ch6-p187
      confidence: single-source
    - name: prebake_time
      value: "1–2"
      unit: min
      source: Xiao2012-ch6-p187
      confidence: single-source
    - name: antireflective_layer
      value: organic BARC under the resist
      unit: null
      source: [Xiao2012-ch6-p201, PG2023-ch5-p222]
      confidence: verified

# Overlay step (kind thermal): reuses the resist-coat model. The 10–20% shrinkage is
# not modeled; the coat's 100 nm stands for the baked film.
- id: sti-04-soft-bake
  module: sti
  title: Soft bake
  kind: thermal
  tool: litho
  mask: null
  transition:
    type: thermal
  camera: overview
  cut: gate_y
  callouts:
    - anchor: photoresist
      text: Film firms as solvent leaves
  summary: >-
    Near 100 °C the film turns from liquid to solid, so the image printed next
    will not blur.
  explanation: >-
    A hot plate drives most of the solvent out, and the film shrinks by up to a
    fifth. A soft film could tremble during exposure and smear the image, like a
    photo taken with an unsteady hand. Then a chill plate brings the wafer back
    to room temperature. That matters: one degree of warmth stretches a 300 mm
    wafer by about 750 nm, while later patterns must line up within a few
    nanometers.
  details: >-
    The bake drives out most of the solvent and turns the resist from liquid to
    solid; it also improves adhesion, and the film shrinks by about 10–20% while
    keeping 5–20% solvent [Xiao2012-ch6-p193]. Plummer & Griffin call it the
    pre-bake and give 90–100 °C, with solvent falling from about 25% to 5% and
    stresses from spinning relaxing [PG2023-ch5-p186]. An underbaked film is
    soft enough to shake during exposure and blur the image [Xiao2012-ch6-p193].
    The model treats its 100 nm film as the baked thickness and does not show
    the shrinkage.

    Each resist has its own optimized bake [Xiao2012-ch6-p193]. Plummer &
    Griffin's typical flow lists 10–30 min [PG2023-ch5-p185], but advanced fabs
    bake on hot plates in the track [Xiao2012-ch6-p193], and Xiao gives about
    1 min for the hot-plate post-exposure bake [Xiao2012-ch6-p202], so that time
    is flagged uncertain. Neither source gives the gas around the hot plate. For
    a chemically amplified resist the bake must leave some solvent behind,
    because the acid needs it to diffuse during the post-exposure bake
    [Xiao2012-ch6-p193].

    After the bake, the wafer cools on a chill plate and must hold its
    temperature through alignment and exposure: at an expansion of
    2.5×10<sup>−6</sup> per °C, a 1 °C change alters a 300 mm wafer's diameter
    by 0.75 µm [Xiao2012-ch6-p180, Xiao2012-ch6-p194].

    Comparisons: overlay tolerance is 10–20% of the critical dimension
    [Xiao2012-ch6-p180]. For Intel's 30 nm gate [Natarajan2008-p1] that is
    3–6 nm, against about 750 nm of stretch per degree.
  params:
    - name: temperature
      value: "90–100"
      unit: °C
      source: PG2023-ch5-p186
      confidence: single-source
    - name: time
      value: "10–30"
      unit: min
      source: PG2023-ch5-p185
      confidence: uncertain
    - name: ambient
      value: not stated (hot plate in the track)
      unit: null
      source: Xiao2012-ch6-p193
      confidence: uncertain
    - name: method
      value: hot plate, then chill plate
      unit: null
      source: Xiao2012-ch6-p193
      confidence: single-source
    - name: shrinkage
      value: "10–20"
      unit: "%"
      source: Xiao2012-ch6-p193
      confidence: single-source

# Overlay step (kind exposure): reuses the resist-coat model. The litho_expose animator
# plays UV through the active-area pattern; the latent image is not drawn.
- id: sti-05-expose
  module: sti
  title: Exposure
  kind: exposure
  tool: litho
  mask: active
  story: true
  transition:
    type: litho_expose
  camera: overview
  cut: gate_y
  callouts:
    - anchor: photoresist
      text: Hidden image in the film
  summary: >-
    A projector run backwards shrinks the first pattern onto the wafer, shining
    ultraviolet light through a film of water.
  explanation: >-
    Ultraviolet light shines through a patterned glass plate, and lenses shrink
    the image to a quarter of its size. A thin film of water between the last
    lens and the wafer sharpens it, a trick borrowed from microscopes. Where the
    light lands, the film changes chemically, though nothing shows yet. This
    first pattern marks where every transistor will go, and some of its gaps are
    narrower than the light's own wavelength of 193 nm.
  details: >-
    This is the active-area mask: its pattern keeps resist over the two
    transistor regions and lets it clear wherever a trench will be cut. The
    first patterning step of a process is aligned to the wafer's notch
    [Xiao2012-ch6-p197]; each later mask is aligned to the patterns already on
    the wafer [PG2023-ch5-p150].

    The light is 193 nm, from an argon fluoride (ArF) excimer laser
    [Xiao2012-ch6-p199, Xiao2012-ch6-tab6.1], still the light used for
    virtually all chips [PG2023-ch5-p150]. Intel used 193 nm immersion for its
    critical layers at 32 nm [Natarajan2008-p1]; the model assumes this layer is
    one of them. Xiao compares projection printing to an overhead projector,
    which enlarges about ten times [Xiao2012-ch6-p195]; the scanner runs the
    other way. Its reticle, a chromium-patterned glass plate, carries the
    pattern at four times its printed size [Xiao2012-ch6-p197,
    PG2023-ch5-p159]. A scanner exposes one field at a time through a slit,
    moving reticle and wafer in sync, then steps to the next field
    [Xiao2012-ch6-p196, Xiao2012-ch6-p197]; today's 193 nm tools print a
    26 × 33 mm field with 1–2 nm overlay at about 275 wafers an hour
    [PG2023-ch5-p163].

    In immersion, purified water fills a gap of about 1 mm between the last lens
    and the wafer and is held there while the stage moves [PG2023-ch5-p220].
    Water passes more than 90% of 193 nm light [PG2023-ch5-p219], and its
    refractive index of 1.44 [Xiao2012-ch6-p221, PG2023-ch5-p220] lets the lens
    capture light at steeper angles, so today's tools reach a numerical aperture
    of about 1.35 [PG2023-ch5-p219, PG2023-ch5-p220]. Xiao writes the resolution
    as R = k<sub>1</sub>λ/(n·NA), a gain of about one technology node, and the
    depth of focus improves by at least 1.46× [Xiao2012-ch6-p221]. The idea
    comes from microscopes: Carl Zeiss used it in the nineteenth century, and it
    reached chip manufacturing around 2005 [PG2023-ch5-p218].

    Where light lands, this chemically amplified resist releases acid; the image
    stays latent until the post-exposure bake and development
    [Xiao2012-ch6-p184, Xiao2012-ch6-p202, PG2023-ch5-p186]. Typical doses for such resists exceed
    20–40 mJ/cm<sup>2</sup> [PG2023-ch5-p187]. Xiao (2012) gives $30–40 million
    for an advanced 193 nm immersion scanner, usually the most expensive tool in
    a fab [Xiao2012-ch6-p197]; Plummer & Griffin (2023) put state-of-the-art
    193 nm tools above $50 million [PG2023-ch5-p151].

    Comparisons: some gaps here are narrower than the 193 nm wavelength. The gap
    between this cell's two transistors is about 141 nm in the scaled layout
    [Nangate2010-invx1], and Intel's isolation pattern repeats every 140 nm
    [Natarajan2008-tab1], so its tightest gaps are narrower still.
  params:
    - name: wavelength
      value: 193
      unit: nm
      source: [Natarajan2008-p1, Xiao2012-ch6-p199]
      confidence: verified
    - name: dose
      value: "> 20–40"
